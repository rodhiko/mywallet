try{apiKey=localStorage.getItem('dk_key')||''}catch(e){}
const setApiKey=k=>{apiKey=(k||'').trim();try{if(apiKey)localStorage.setItem('dk_key',apiKey);else localStorage.removeItem('dk_key')}catch(e){}};
async function load(){
  let L=null;try{L=JSON.parse(localStorage.getItem('dk')||'null')}catch(e){}
  if(hasApi()&&apiKey){
    try{
      const res=await fetch(API_URL+'?action=load&key='+encodeURIComponent(apiKey));
      const j=await res.json();
      if(j&&j.ok){keyErr='';if(j.state)L=j.state;where='Saved to Google Sheets'}
      else{
        const msg=(j&&j.error)||'Load failed';
        if(/Unauthorized/i.test(msg)){keyErr='Kunci akses salah. Silakan masukkan ulang.';setApiKey('');ready=true;render();return}
        throw new Error(msg);
      }
    }catch(e){where='Offline, saved on this device'}
  }else if(!hasApi()){where='Set API_URL in index.html'}
  R=(L&&L.u)?L:{u:L?{rodhi:L}:{}};ready=true;render();
}
function save(){try{localStorage.setItem('dk',JSON.stringify(R))}catch(e){}
  clearTimeout(timer);timer=setTimeout(async()=>{if(!me||!hasApi()||!apiKey)return;
    try{
      const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'save',key:apiKey,id:me,data:S})});
      const j=await res.json();
      if(j&&j.ok){if(where!='Saved to Google Sheets'){where='Saved to Google Sheets';render()}}
      else throw new Error((j&&j.error)||'Save failed');
    }catch(e){where='Sheet save failed, kept on this device';render()}
  },600)}

function inP(d,p){const t=td();if(p.k=='today')return d==t;if(p.k=='day')return d==(p.d||t);if(p.k=='month')return d.slice(0,7)==t.slice(0,7);if(p.k=='year')return d.slice(0,4)==t.slice(0,4);
  if(p.k=='week'){const n=new Date(),s=new Date(n);s.setDate(n.getDate()-((n.getDay()+6)%7));const e=new Date(s);e.setDate(s.getDate()+6);return d>=iso(s)&&d<=iso(e)}return true}

function trendBlock(){
  const n=new Date(),B=[];
  if(trk=='7d')for(let i=6;i>=0;i--){const d=new Date(n);d.setDate(n.getDate()-i);const k=iso(d);B.push([d.toLocaleDateString('en-GB',{weekday:'short'}),x=>x.d==k])}
  else if(trk=='4w')for(let i=3;i>=0;i--){const st=new Date(n);st.setDate(n.getDate()-((n.getDay()+6)%7)-i*7);const en=new Date(st);en.setDate(st.getDate()+6);const a=iso(st),b=iso(en);B.push([st.getDate()+' '+st.toLocaleDateString('en-GB',{month:'short'}),x=>x.d>=a&&x.d<=b])}
  else if(trk=='5y')for(let i=4;i>=0;i--){const y=String(n.getFullYear()-i);B.push([y,x=>x.d.slice(0,4)==y])}
  else{const c=trk=='6m'?6:12;for(let i=c-1;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1),k=d.getFullYear()+'-'+pad(d.getMonth()+1);B.push([d.toLocaleDateString('en-GB',{month:'short'}),x=>x.d.slice(0,7)==k])}}
  const ms=B.map(([l,f])=>{const a=S.tx.filter(f);return[l,sum(a,'i'),sum(a,'e')]}),tm=Math.max(1,...ms.flatMap(x=>[x[1],x[2]]));

  const bt=(f,t)=>`<button type="button" class="sel" id="f_${f.id}" data-v="${esc(f.v)}"><span class="t">${esc(t)}</span><span aria-hidden="true">▾</span></button>`,fld=(f,b)=>`<div class="fld"><span class="fl">${esc(f.l)}</span>${b}</div>`;
  const fh=f=>f.pair?`<div class="two">${f.pair.map(fh).join('')}</div>`:f.k=='sel'?fld(f,bt(f,lab(f.o,f.v)||f.v)):f.k=='date'?fld(f,bt(f,fd(f.v))):f.k=='time'?fld(f,bt(f,f.v))
   :f.k=='pick'?`<div class="fld"><span class="fl">${esc(f.l)}</span><div class="pk ${f.cl?'cl':''}" id="f_${f.id}" data-v="${esc(f.v)}">${f.items.map(([v,h])=>`<button type="button" class="${v==f.v?'on':''}" data-pv="${esc(v)}" aria-label="${esc(v)}">${h}</button>`).join('')}</div></div>`
   :f.k=='calc'?`<label>${esc(f.l)}<input class="calcf" id="f_${f.id}" type="text" inputmode="none" autocomplete="off" placeholder="0" value="${esc(f.v)}"></label><div class="mut" id="cr"></div><div class="kp">${[['7'],['8'],['9'],['÷','op'],['⌫','op','B'],['4'],['5'],['6'],['×','op'],['C','op'],['1'],['2'],['3'],['−','op'],['+','op'],['0'],['00'],['000'],[',',''],['=','eq']].map(k=>`<button type="button" class="${k[1]||''}" data-k="${k[2]||k[0]}">${k[0]}</button>`).join('')}</div>`
   :`<label>${esc(f.l)}<input id="f_${f.id}" type="text" value="${esc(f.v==null?'':f.v)}"></label>`;
  el.innerHTML=`<div class="sh" role="dialog" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${fields.map(fh).join('')}<div class="row act"><button class="b pri" data-s="ok">Save</button>${onDel?'<button class="b red" data-s="del">Delete</button>':''}<button class="b" data-s="x">Cancel</button></div><p class="err"></p></div>`;
  document.body.appendChild(el);const q=s=>el.querySelector(s),err=m=>q('.err').textContent=m;
  const pv=()=>{const i=q('.calcf'),c=q('#cr');if(i&&c){const v=calc(i.value);c.textContent=i.value&&!isNaN(v)&&/[+\-−×÷*/]/.test(i.value.replace(/^[-−]/,''))?'= '+rp(v):''}};pv();
  el.addEventListener('input',e=>{if(e.target.classList.contains('calcf'))e.target.value=fmtX(e.target.value.replace(/\./g,'').replace(/[^\d,+\-−×÷*/]/g,''));pv()});
  el.addEventListener('click',async e=>{
    const sb=e.target.closest('.sel');if(sb){const f=flat.find(x=>'f_'+x.id==sb.id),t=sb.querySelector('.t');
      if(f.k=='sel')pickSel(f.l,f.o,sb.dataset.v,v=>{sb.dataset.v=v;t.textContent=lab(f.o,v)||v});
      else if(f.k=='date')pickDate(sb.dataset.v,d=>{sb.dataset.v=d;t.textContent=fd(d)});
      else pickTime(sb.dataset.v,v=>{sb.dataset.v=v;t.textContent=v});return}
    const pb=e.target.closest('[data-pv]');if(pb){const g=pb.parentNode;g.dataset.v=pb.dataset.pv;g.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b==pb));return}
    const kb=e.target.closest('[data-k]');if(kb){const i=q('.calcf'),c=kb.dataset.k;let r=i.value.replace(/\./g,'');if(c=='C')r='';else if(c=='B')r=r.slice(0,-1);else if(c=='='){const v=calc(i.value);if(!isNaN(v))r=String(Math.round(v))}else r+=c;i.value=fmtX(r);pv();return}
    const s=e.target.dataset.s;if(e.target===el||s=='x'){el.remove();return}
    if(s=='del'){const r=onDel();if(typeof r=='string'){err(r);return}el.remove();save();render();return}
    if(s=='ok'){const v={};flat.forEach(f=>{const n=q('#f_'+f.id);v[f.id]=n.dataset.v!==undefined?n.dataset.v:n.value});const r=await onSave(v);if(typeof r=='string'){err(r);return}el.remove();save();render()}});
}
const catItems=()=>[{h:'Expense'},...S.cats.filter(c=>c.t=='e').map(c=>[c.id,c.name,c.color]),{h:'Income'},...S.cats.filter(c=>c.t=='i').map(c=>[c.id,c.name,c.color])],accItems=()=>S.acc.map(a=>[a.id,a.name]);
function txSheet(x,pre){
  if(!S.acc.length){sheet('Add an account first',[],()=>{});return}
  sheet(x?'Edit transaction':'New transaction',[{id:'a',l:'Amount (Rp)',k:'calc',v:x?fnum(x.a):''},{pair:[{id:'c',l:'Category',k:'sel',o:catItems(),v:x?x.c:(pre||'eFood')},{id:'d',l:'Date',k:'date',v:x?x.d:td()}]},{pair:[{id:'w',l:'Account',k:'sel',o:accItems(),v:x?x.w:S.acc[0].id},{id:'m',l:'Payment',k:'sel',o:METH.map(m=>[m,m]),v:x?x.m:'Cash'}]},{id:'n',l:'Note',v:x?x.n:''}],
  v=>{const a=calc(v.a);if(!(a>0))return'Enter an amount greater than 0.';const o={id:x?x.id:uid(),a:Math.round(a*100)/100,t:catOf(v.c).t,c:v.c,w:v.w,m:v.m,d:v.d||td(),n:v.n.trim()};if(x)Object.assign(x,o);else S.tx.push(o)},x?()=>{S.tx=S.tx.filter(y=>y!==x)}:null)}
function catSheet(c){
  sheet(c?'Edit category':'New '+(catT=='e'?'expense':'income')+' category',[{id:'name',l:'Name',v:c?c.name:''},{id:'icon',l:'Icon',k:'pick',v:c?c.icon:'star',items:Object.keys(ICO).map(k=>[k,svg(ICO[k])])},{id:'color',l:'Color',k:'pick',cl:1,v:c?c.color:COLORS[S.cats.length%12],items:COLORS.map(k=>[k,`<i style="width:22px;height:22px;border-radius:50%;background:${k};display:block;border:2px solid #111"></i>`])}],
  v=>{if(!v.name.trim())return'Enter a category name.';if(c)Object.assign(c,{name:v.name.trim(),icon:v.icon,color:v.color});else S.cats.push({id:uid(),name:v.name.trim(),icon:v.icon,color:v.color,t:catT})},
  c?()=>{if(S.tx.some(x=>x.c==c.id))return'This category has transactions. Edit those first.';S.cats=S.cats.filter(y=>y!==c);delete S.budgets[c.id]}:null)}
function accSheet(a){
  sheet(a?'Edit account':'New account',[{id:'name',l:'Name',v:a?a.name:''},{id:'bal',l:a?'Current balance (Rp)':'Starting balance (Rp)',k:'calc',v:a?fnum(accBal(a)):''}],
  v=>{if(!v.name.trim())return'Enter an account name.';const b=Math.round(calc(v.bal)||0);if(a){a.bal+=b-accBal(a);a.name=v.name.trim()}else S.acc.push({id:uid(),name:v.name.trim(),bal:b})},
  a?()=>{if(S.tx.some(x=>x.w==a.id))return'This account has transactions. Delete or edit those first.';S.acc=S.acc.filter(y=>y!==a)}:null)}
const goalSheet=g=>sheet(g?'Edit goal':'New savings goal',[{id:'name',l:'Goal name',v:g?g.name:''},{id:'target',l:'Target amount (Rp)',k:'calc',v:g?fnum(g.target):''}],v=>{const t=Math.round(calc(v.target));if(!v.name.trim()||!(t>0))return'Enter a name and a target amount.';if(g){g.name=v.name.trim();g.target=t}else S.goals.push({id:uid(),name:v.name.trim(),target:t,saved:0})},g?()=>{S.goals=S.goals.filter(y=>y!==g)}:null);
const remSheet=r=>sheet(r?'Edit reminder':'New reminder',[{id:'title',l:'Title',v:r?r.title:''},{pair:[{id:'t',l:'Type',k:'sel',o:[['e','Expense'],['i','Income']],v:r?r.t:'e'},{id:'rep',l:'Repeat',k:'sel',o:[['','Once'],['m','Every month']],v:r&&r.rep?'m':''}]},{pair:[{id:'date',l:'Date',k:'date',v:r?r.date:td()},{id:'time',l:'Time',k:'time',v:r?r.time:'09:00'}]},{id:'amt',l:'Expected amount (optional, Rp)',k:'calc',v:r&&r.amt?fnum(r.amt):''}],v=>{if(!v.title.trim()||!v.date)return'Enter a title and a date.';const o={title:v.title.trim(),t:v.t,amt:Math.round(calc(v.amt)||0),date:v.date,time:v.time||'09:00',rep:v.rep,n:0};if(r)Object.assign(r,o);else S.rem.push(Object.assign({id:uid()},o))},r?()=>{S.rem=S.rem.filter(y=>y!==r)}:null);

/* ---------- actions ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el||e.target.closest('.ov'))return;const a=el.dataset.act,id=el.dataset.id;
  if(a=='savekey'){const v=($('#akey').value||'').trim();if(!v){$('#kerr').textContent='Masukkan kunci akses.';return}setApiKey(v);ready=false;render();load();return}
  if(a=='resetkey'){setApiKey('');keyErr='';render();return}
  if(a=='login'){pend=el.dataset.u;if(!(R.u[pend]||{}).pin)enter(pend);else render();return}
  if(a=='back'){pend=null;render();return}
  if(a=='unlock'){if(await hash($('#pin').value)==(R.u[pend]||{}).pin)enter(pend);else $('#perr').textContent='Wrong PIN. Try again.';return}
  if(a=='tab'){if(view!=el.dataset.k){view=el.dataset.k;anim=true;window.scrollTo(0,0);render()}}
  else if(a=='theme'){setTheme(isDark()?'light':'dark');render()}
  else if(a=='catEdit'){catEdit=!catEdit;render()}
  else if(a=='catadd')txSheet(null,id);
  else if(a=='catup')mvCat(id,-1);
  else if(a=='catdown')mvCat(id,1);
  else if(a=='eye'){show=!show;document.querySelectorAll('[data-mv]').forEach(n=>{n.textContent=mv(OV[n.dataset.mv]||0);n.classList.remove('pp');void n.offsetWidth;n.classList.add('pp')});const h=$('[data-hint]');if(h)h.textContent='Tap to '+(show?'hide':'show')}
  else if(a=='per')pickSel('Period',PER,P[el.dataset.k].k,v=>{P[el.dataset.k].k=v;render()});
  else if(a=='perday')pickDate(P[el.dataset.k].d||td(),d=>{P[el.dataset.k].d=d;render()});
  else if(a=='flt'){const f=el.dataset.f,o=f=='t'?[['','All types'],['e','Expense'],['i','Income']]:f=='w'?[['','All accounts'],...accItems()]:[['','All categories'],...catItems()];pickSel({t:'Type',w:'Account',c:'Category'}[f],o,flt[f],v=>{flt[f]=v;render()})}
  else if(a=='trk')pickSel('Trend period',TR,trk,v=>{trk=v;$('#trw').innerHTML=trendBlock()});
  else if(a=='catT'){catT=el.dataset.t;render()}
  else if(a=='add')txSheet();
  else if(a=='edit')txSheet(S.tx.find(x=>x.id==id));
  else if(a=='catnew')catSheet();
  else if(a=='catedit')catSheet(S.cats.find(c=>c.id==id));
  else if(a=='accnew')accSheet();
  else if(a=='accedit')accSheet(S.acc.find(x=>x.id==id));
  else if(a=='bud'){const c=catOf(id);sheet('Budget: '+c.name,[{id:'b',l:'Monthly limit (Rp), empty to remove',k:'calc',v:fnum(S.budgets[id])}],v=>{const b=calc(v.b);if(b>0)S.budgets[id]=Math.round(b);else delete S.budgets[id]})}
  else if(a=='goalnew')goalSheet();
  else if(a=='goaledit')goalSheet(S.goals.find(g=>g.id==id));
  else if(a=='goaladd'){const g=S.goals.find(g=>g.id==id);sheet('Save toward '+g.name,[{id:'a',l:'Amount (Rp)',k:'calc',v:''}],v=>{const n=Math.round(calc(v.a));if(!(n>0))return'Enter an amount greater than 0.';g.saved+=n})}
  else if(a=='remnew')remSheet();
  else if(a=='remedit')remSheet(S.rem.find(r=>r.id==id));
  else if(a=='remdone'){const r=S.rem.find(r=>r.id==id);if(r.rep){const d=new Date(r.date+'T00:00');d.setMonth(d.getMonth()+1);r.date=iso(d);r.n=0}else S.rem=S.rem.filter(x=>x!==r);save();render()}
  else if(a=='notif'){try{await Notification.requestPermission()}catch(x){}render()}
  else if(a=='pin')sheet('App PIN',[{id:'p',l:'New PIN (4 to 6 digits), empty to remove',k:'password'}],async v=>{if(!v.p){S.pin=null;return}if(!/^\d{4,6}$/.test(v.p))return'PIN must be 4 to 6 digits.';S.pin=await hash(v.p)});
  else if(a=='lock'){me=null;S=null;pend=null;show=false;render()}
  else if(a=='export'){const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"',csv='Date,Type,Category,Amount,Account,Method,Note\r\n'+[...S.tx].sort((a,b)=>a.d.localeCompare(b.d)).map(x=>[x.d,x.t=='e'?'Expense':'Income',catOf(x.c).name,x.a,accOf(x.w).name,x.m,x.n].map(q).join(',')).join('\r\n');
    try{const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),dl=document.createElement('a');dl.href=url;dl.download='MyWallet_'+me+'_'+td()+'.csv';document.body.appendChild(dl);dl.click();setTimeout(()=>{dl.remove();URL.revokeObjectURL(url)},1000)}catch(x){try{sheet('Copy CSV data',[{id:'c',l:'Copy this text and paste it into Google Sheets or a file',v:csv}],()=>{})}catch(y){}}}
});
document.addEventListener('input',e=>{const d=e.target.dataset;if(d.f){flt[d.f]=e.target.value;$('#txl').innerHTML=txlist()}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&!me){const b=document.querySelector('[data-act="unlock"],[data-act="savekey"]');if(b)b.click()}});
function checkDue(){dueList().forEach(r=>{if(!r.n&&'Notification' in window&&Notification.permission=='granted'){try{new Notification('MyWallet',{body:(r.t=='e'?'Time to pay: ':'Income: ')+r.title})}catch(x){}r.n=1;save()}})}
setInterval(()=>{checkDue();if(me&&view=='overview'&&!document.querySelector('.ov'))render()},30000);
render();load();
